[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
tauri-plugin-process = "2.3.1"
# mDNS/DNS-SD advertisement so a manager's phone can find Station by name.
#
# Pure Rust, cross-platform (Windows 10/11 and macOS), no Bonjour and no system
# dependency. Default features are disabled: this app does not need the async
# flume channel or the `log` bridge, because advertisement is started and
# stopped synchronously alongside the HTTP server. Keeping them off stops an
# async runtime re-entering a synchronous application.
mdns-sd = { version = "0.21.4", default-features = false }
# Local HTTP API for manager access on the cafe LAN.
#
# tiny_http is chosen deliberately over Axum/Tokio: Station is a synchronous,
# offline-first desktop app whose entire data path is a single
# `Mutex<Connection>`. Axum would drag in a Tokio runtime that the business
# layer would then have to be reshaped around, for two endpoints. tiny_http is
# a blocking, thread-per-connection server that shares that model exactly.
# MIT OR Apache-2.0, actively maintained, no async runtime.
tiny_http = "0.12.0"
# Detects this machine's LAN address so the API and the QR can address the
# real interface instead of a hardcoded IP. MIT OR Apache-2.0.
local-ip-address = "0.6.13"
# Automatic updates (build infrastructure only). The `plugins.updater` config
# in tauri.conf.json — pubkey + fixed endpoint — is REQUIRED and is registered
# in lib.rs; without it tauri-plugin-updater fails at startup. The private
# signing key never enters this repository: it lives only in the CI secret
# TAURI_SIGNING_PRIVATE_KEY. See docs/RELEASING.md.
tauri-plugin-updater = "2"
thiserror = "2.0.20"
argon2 = "0.5"
image = "0.25"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4.45", features = ["clock"] }
chrono-tz = "0.10.4"

# Used only by `examples/gen_previews.rs` (static PDF previews), not the shipped
# app binary.
[dev-dependencies]
printpdf = { version = "0.11.1", features = ["png"] }
