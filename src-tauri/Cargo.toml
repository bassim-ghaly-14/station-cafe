[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-process = "2.3.1"
thiserror = "2.0.20"
argon2 = "0.5"
image = "0.25"
rand = "0.8"
sha2 = "0.10"

# Used only by `examples/gen_previews.rs` (static PDF previews), not the shipped
# app binary.
[dev-dependencies]
printpdf = { version = "0.11.1", features = ["png"] }
