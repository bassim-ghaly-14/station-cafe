name: TEMP Signing Diagnostic

# TEMPORARY, READ-ONLY DIAGNOSTIC - delete after the signing failure is closed.
# It reports ONLY: presence, byte length, one-way SHA-256 and structural
# booleans. It never prints the key, the password, or any decoded key material.
on:
  workflow_dispatch:
  push:
    branches: ['tmp-signing-diagnostic']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fingerprint each signing layer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -uo pipefail

          EXPECTED_KEY_SHA256=83b4ad8d1e878e688e950759be5a9a3b4d63a83b1f2ba37c17b728e27da0b195
          EXPECTED_KEY_LENGTH=348

          echo "os: $RUNNER_OS arch: $(uname -m)"
          echo "tauri-cli: $(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"

          key="${TAURI_SIGNING_PRIVATE_KEY-__UNSET__}"
          if [ "$key" = "__UNSET__" ]; then
            echo "KEY: env var NOT SET at all"
          elif [ -z "$key" ]; then
            echo "KEY: env var SET but EMPTY (length=0)"
          else
            echo "KEY: length=${#key} sha256=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)"
            echo "KEY: expected length=$EXPECTED_KEY_LENGTH sha256=$EXPECTED_KEY_SHA256"
            if [ "${#key}" -eq "$EXPECTED_KEY_LENGTH" ] && \
               [ "$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)" = "$EXPECTED_KEY_SHA256" ]; then
              echo "KEY: MATCHES the committed key (byte-for-byte, no normalisation)"
            else
              echo "KEY: does NOT match the committed key"
            fi
            if decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null); then
              echo "KEY: base64 decodes=yes"
              case "$decoded" in
                "untrusted comment: "*) echo "KEY: untrusted-comment line present=yes" ;;
                *) echo "KEY: untrusted-comment line present=NO" ;;
              esac
              echo "KEY: decoded prefix=$(printf '%s' "$decoded" | head -c 34 | tr -d '\n')"
            else
              echo "KEY: base64 decodes=NO"
            fi
            if printf '%s' "$key" | grep -q $'\r'; then echo "KEY: contains CR=yes"; else echo "KEY: contains CR=no"; fi
          fi

          pw="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD-__UNSET__}"
          if [ "$pw" = "__UNSET__" ]; then
            echo "PASSWORD: env var NOT SET at all (Tauri would prompt -> fail in CI)"
          elif [ -z "$pw" ]; then
            echo "PASSWORD: env var SET and EMPTY (length=0) -> this is the correct value for this key"
          else
            echo "PASSWORD: env var SET and NON-EMPTY, length=${#pw} (value never printed)"
            echo "PASSWORD: sha256=$(printf '%s' "$pw" | sha256sum | cut -d' ' -f1)"
          fi

          echo "pubkey: $(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | head -c 44)..."
