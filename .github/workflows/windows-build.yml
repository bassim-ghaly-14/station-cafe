name: Windows Build

# Builds the production Windows .exe for every tag (release) and
# provides a test build artifact on pushes to main.
# The developer never needs a Windows machine for normal releases.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          # Required for automatic updates (Phase 2): signing key + release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Station Cafe v__VERSION__'
          releaseBody: 'انظر التغييرات في المرفقات / See the assets below.'
          releaseDraft: false
          prerelease: false
