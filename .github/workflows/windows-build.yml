name: Windows Build

# Builds the production Windows .exe.
#
# Two distinct outcomes, and the difference matters:
#   - push a `v*` TAG  -> publishes a real GitHub Release for that version.
#   - push to `main`   -> builds and verifies ONLY; the release is created as
#                         a draft prerelease, so ordinary commits can never
#                         overwrite a published release or become an update
#                         target for installed clients.
# The developer never needs a Windows machine for normal releases.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Verify version consistency
        # The installer filename, the release tag and the updater manifest
        # version are all derived from the version in package.json /
        # Cargo.toml / tauri.conf.json. If those three disagree, a published
        # release advertises an update version that no client will ever
        # compare against itself. This gate fails the build instead.
        # On a tag push the tag is checked too (a release tag must be v<version>).
        run: node scripts/check-version.mjs --tag "$env:STATION_TAG"
        shell: pwsh
        env:
          STATION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Verify updater signing key (diagnostics only)
        # Tauri reports a bad key, a bad password and a malformed secret with
        # the SAME "failed to decode secret key" error, so a red CI run says
        # nothing about WHICH layer broke. This step fingerprints each layer
        # separately, so the next failure names its own cause.
        #
        # It never prints the key or the password. Only lengths, a one-way
        # SHA-256 and structural booleans are logged, so nothing secret can
        # reach the log or an artifact. The fingerprint is a checksum of a
        # 348-byte random key: it identifies WHICH key is deployed and is not
        # reversible into the key itself.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # SHA-256 of the exact bytes of ~/.tauri/station-cafe.key (the one
          # whose public half is committed as plugins.updater.pubkey).
          # If the key is ever rotated on purpose, update this AND the pubkey
          # in the same commit.
          EXPECTED_KEY_SHA256=83b4ad8d1e878e688e950759be5a9a3b4d63a83b1f2ba37c17b728e27da0b195
          EXPECTED_KEY_LENGTH=348

          echo "runner: $RUNNER_OS $(uname -m) | tauri-cli: $(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"

          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::LAYER 1 (secret missing): TAURI_SIGNING_PRIVATE_KEY is empty or unset. The build would abort rather than publish an unsigned update."
            exit 1
          fi

          # printf '%s' avoids adding a newline, so this hashes the value
          # exactly as the build consumes it - no whitespace normalisation.
          key_len=${#key}
          key_sha=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)
          echo "key: present=yes length=$key_len sha256=$key_sha"

          # Structure is checked BEFORE the fingerprint, so a mangled secret is
          # reported as the specific corruption it is ("not base64", "lost
          # comment", "CRLF") rather than being flattened into a generic
          # "wrong key". The fingerprint is the final catch-all for a
          # well-formed key that simply is not the committed one.
          if ! decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null); then
            echo "::error::LAYER 3 (not base64): the secret is not valid base64. Set it from the raw file, not from a copy/paste of its decoded form."
            exit 1
          fi
          case "$decoded" in
            "untrusted comment: "*)
              echo "keybox: comment line present=yes" ;;
            *)
              echo "::error::LAYER 4 (missing comment): the decoded key has no 'untrusted comment:' line - a partial paste. Re-set it from the raw file."
              exit 1 ;;
          esac
          if printf '%s' "$key" | grep -q $'\r'; then
            echo "::error::LAYER 5 (CRLF): the secret contains CR characters. Re-set it from the raw file; do not paste it through an editor."
            exit 1
          fi
          echo "keybox: base64=yes comment=yes crlf=no"

          if [ "$key_len" -ne "$EXPECTED_KEY_LENGTH" ] || [ "$key_sha" != "$EXPECTED_KEY_SHA256" ]; then
            echo "::error::LAYER 2 (wrong key): the secret is well-formed but is not the key whose public half is committed as plugins.updater.pubkey. Re-set it with: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/station-cafe.key"
            exit 1
          fi

          # The password is reported as state and length ONLY. GitHub masks the
          # value, and this never prints it.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD+x}" ]; then
            echo "password: variable not exported (Tauri will use an empty password)"
          else
            echo "password: variable exported, length=${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD} (value never printed)"
          fi

          # The trust anchor the release will be checked against at runtime.
          echo "pubkey: $(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | head -c 44)... (fingerprint only)"

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Tauri UPDATER signing (minisign) — proves an update bundle was
          # produced by this project. This is NOT Windows Authenticode
          # signing; see docs/RELEASING.md. The private key must exist as a
          # repository secret and must never be committed or echoed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Windows release artifacts ONLY: NSIS. The Tauri updater signs and
          # applies NSIS exclusively, so an MSI could never be updated to, and
          # building it would drag the WiX toolchain into every release for an
          # artifact no client uses. The bundle `targets` key stays "all" in
          # tauri.conf.json because that config is shared with the macOS
          # developer build, where "nsis" is not a valid target.
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: 'Station Cafe v__VERSION__'
          releaseBody: 'انظر التغييرات في المرفقات / See the assets below.'
          # A release is published ONLY for a version tag. A push to main
          # must verify the build, not publish a release: without this the
          # workflow would overwrite the published v<version> release on
          # every commit, and the updater would serve a moving target.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
