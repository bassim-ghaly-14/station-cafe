name: Release Build

# Builds the production Station installers for WINDOWS and macOS and publishes
# them as updater artifacts to the SAME GitHub Release.
#
# Two distinct outcomes, and the difference matters:
#   - push a `v*` TAG  -> publishes a real GitHub Release for that version.
#   - push to `main`   -> builds and verifies ONLY; the release is created as
#                         a draft prerelease, so ordinary commits can never
#                         overwrite a published release or become an update
#                         target for installed clients.
# The developer never needs a Windows or a Mac machine for normal releases.
#
# Why the macOS job is NOT parallel to the Windows one
# ---------------------------------------------------
# `tauri-action` builds `latest.json` by MERGING into the manifest already
# attached to the release: it reads the existing asset, keeps every
# `platforms` entry it does not own, and writes back the union. Two jobs
# uploading that asset at the same instant race, and the loser's entries
# (here: the whole macOS half) vanish — the release then looks published and
# complete while every Mac client is told "no build for this platform".
# `needs: build-windows` makes the merge order deterministic instead.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    # `contents: write` is granted HERE, not at workflow level (Sonar
    # githubactions:S8233): only the two `tauri-action` jobs create and upload
    # release assets, so the write token must not be reachable from every job.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        # `tests/lanContract.test.ts` audits the REAL production artifact in
        # `dist/` — the same directory `tauri.conf.json` embeds and the Rust LAN
        # listener serves. `dist/` is gitignored, so a clean checkout has none,
        # and the only build in this workflow used to happen later, inside the
        # `tauri-action` step, AFTER the tests had already run. The suite then
        # read no manifest at all and `JSON.parse('')` failed.
        #
        # This step exists so the artifact exists before it is audited. The
        # build is unchanged: it is the same `pnpm build` that
        # `beforeBuildCommand` runs, so the audited bundle is byte-identical to
        # the shipped one.
        run: pnpm build

      - name: Typecheck & test
        run: pnpm typecheck && pnpm lint && pnpm test

      - name: Verify version consistency
        # The installer filename, the release tag and the updater manifest
        # version are all derived from the version in package.json /
        # Cargo.toml / tauri.conf.json. If those three disagree, a published
        # release advertises an update version that no client will ever
        # compare against itself. This gate fails the build instead.
        # On a tag push the tag is checked too (a release tag must be v<version>).
        run: node scripts/check-version.mjs --tag "$env:STATION_TAG"
        shell: pwsh
        env:
          STATION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Verify updater signing key (diagnostics only)
        # Tauri reports a bad key, a bad password and a malformed secret with
        # the SAME "failed to decode secret key" error, so a red CI run says
        # nothing about WHICH layer broke. This step fingerprints each layer
        # separately, so the next failure names its own cause.
        #
        # It never prints the key or the password. Only lengths, a one-way
        # SHA-256 and structural booleans are logged, so nothing secret can
        # reach the log or an artifact. The fingerprint is a checksum of a
        # 348-byte random key: it identifies WHICH key is deployed and is not
        # reversible into the key itself.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # SHA-256 of the exact bytes of ~/.tauri/station-cafe.key (the one
          # whose public half is committed as plugins.updater.pubkey).
          # If the key is ever rotated on purpose, update this AND the pubkey
          # in the same commit.
          EXPECTED_KEY_SHA256=83b4ad8d1e878e688e950759be5a9a3b4d63a83b1f2ba37c17b728e27da0b195
          EXPECTED_KEY_LENGTH=348

          echo "runner: $RUNNER_OS $(uname -m) | tauri-cli: $(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"

          key="${TAURI_SIGNING_PRIVATE_KEY:-}"
          if [ -z "$key" ]; then
            echo "::error::LAYER 1 (secret missing): TAURI_SIGNING_PRIVATE_KEY is empty or unset. The build would abort rather than publish an unsigned update."
            exit 1
          fi

          # printf '%s' avoids adding a newline, so this hashes the value
          # exactly as the build consumes it - no whitespace normalisation.
          key_len=${#key}
          key_sha=$(printf '%s' "$key" | sha256sum | cut -d' ' -f1)
          echo "key: present=yes length=$key_len sha256=$key_sha"

          # Structure is checked BEFORE the fingerprint, so a mangled secret is
          # reported as the specific corruption it is ("not base64", "lost
          # comment", "CRLF") rather than being flattened into a generic
          # "wrong key". The fingerprint is the final catch-all for a
          # well-formed key that simply is not the committed one.
          if ! decoded=$(printf '%s' "$key" | base64 -d 2>/dev/null); then
            echo "::error::LAYER 3 (not base64): the secret is not valid base64. Set it from the raw file, not from a copy/paste of its decoded form."
            exit 1
          fi
          case "$decoded" in
            "untrusted comment: "*)
              echo "keybox: comment line present=yes" ;;
            *)
              echo "::error::LAYER 4 (missing comment): the decoded key has no 'untrusted comment:' line - a partial paste. Re-set it from the raw file."
              exit 1 ;;
          esac
          if printf '%s' "$key" | grep -q $'\r'; then
            echo "::error::LAYER 5 (CRLF): the secret contains CR characters. Re-set it from the raw file; do not paste it through an editor."
            exit 1
          fi
          echo "keybox: base64=yes comment=yes crlf=no"

          if [ "$key_len" -ne "$EXPECTED_KEY_LENGTH" ] || [ "$key_sha" != "$EXPECTED_KEY_SHA256" ]; then
            echo "::error::LAYER 2 (wrong key): the secret is well-formed but is not the key whose public half is committed as plugins.updater.pubkey. Re-set it with: gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/station-cafe.key"
            exit 1
          fi

          # The password is checked, not merely reported. This key is in
          # minisign's ENCRYPTED format and its password is the EMPTY string.
          # Any non-empty value here makes Tauri fail at signing time with
          # "failed to decode secret key: ... Wrong password for that key" --
          # the exact error this pipeline produced while the key itself was
          # byte-perfect. Reporting only a length let that pass silently.
          # The value is NEVER printed; only its length is used.
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::LAYER 6 (wrong password): this key is encrypted with an EMPTY password, but TAURI_SIGNING_PRIVATE_KEY_PASSWORD is non-empty (length=${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}). A non-empty password is rejected by the key. Delete the secret with: gh secret delete TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (GitHub cannot store an empty secret, so absence -- not an empty value -- is the correct representation.)"
            exit 1
          fi
          echo "password: empty (correct for this encrypted key; value never printed)"

          # The trust anchor the release will be checked against at runtime.
          echo "pubkey: $(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" | head -c 44)... (fingerprint only)"

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Tauri UPDATER signing (minisign) — proves an update bundle was
          # produced by this project. This is NOT Windows Authenticode
          # signing; see docs/RELEASING.md. The private key must exist as a
          # repository secret and must never be committed or echoed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Windows release artifacts ONLY: NSIS. The Tauri updater signs and
          # applies NSIS exclusively, so an MSI could never be updated to, and
          # building it would drag the WiX toolchain into every release for an
          # artifact no client uses. The bundle `targets` key stays "all" in
          # tauri.conf.json because that config is shared with the macOS
          # developer build, where "nsis" is not a valid target.
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: 'Station Cafe v__VERSION__'
          releaseBody: 'انظر التغييرات في المرفقات / See the assets below.'
          # A release is published ONLY for a version tag. A push to main
          # must verify the build, not publish a release: without this the
          # workflow would overwrite the published v<version> release on
          # every commit, and the updater would serve a moving target.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
  # ---------------------------------------------------------------------------
  # macOS: the same release, the same version, the second platform's artifacts.
  # ---------------------------------------------------------------------------
  build-macos:
    # Sequential on purpose — see the race note at the top of this file.
    needs: build-windows
    # The same release the Windows job created: `tauri-action` merges this
    # platform's entries into the existing `latest.json` and uploads the
    # `.app.tar.gz` + `.sig` pair, which is a release write.
    permissions:
      contents: write
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (stable, both macOS architectures)
        # `universal-apple-darwin` is a LIPO of an aarch64 and an x86_64 build,
        # so both targets must be installed. One artifact then serves Apple
        # Silicon AND Intel, and `tauri-action` expands it into the
        # `darwin-aarch64-app` / `darwin-x86_64-app` manifest keys — exactly
        # the two keys the plugin looks up on those two machines.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key is present
        # The full six-layer diagnostic runs in the Windows job, which executes
        # FIRST (`needs:`), so a broken key has already failed the run by the
        # time this job starts. This step exists because the macOS job reaches
        # the same key-gated build: a missing key must abort here too, never
        # publish an unsigned `.app.tar.gz` no client could verify. Presence is
        # reported; the key is never printed.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset: the macOS build would abort rather than publish an unsigned update artifact."
            exit 1
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be ABSENT: the deployed key is encrypted with an empty password, which Tauri always requires. Run: gh secret delete TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi
          echo "updater signing key: present (value never printed)"

      - name: Detect Apple Developer ID signing credentials
        # Apple code signing is OPTIONAL for the updater and is therefore never
        # required — an unsigned `.app` still installs through the updater,
        # because the updater's integrity guarantee is the minisign signature,
        # not Apple's. It is required only to avoid a Gatekeeper warning on a
        # MANUAL first install from the .dmg.
        #
        # These secrets are exported into the environment ONLY when actually
        # set. Passing `APPLE_CERTIFICATE: ''` would be worse than passing
        # nothing: `tauri-bundler` reads it with `var_os`, which returns
        # `Some("")` for an empty-but-defined variable, so it would try to
        # import an empty certificate and fail the build.
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "apple-signing=enabled"
          else
            echo "apple-signing=disabled (no APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD secret)"
            echo "::warning::Building an unsigned macOS app. The in-app updater still verifies the minisign signature, but a manual first install from the .dmg will show a Gatekeeper warning. See docs/RELEASING.md."
          fi
          # Notarization is all-or-nothing: a partial credential set is a
          # misconfiguration, not a reason to skip silently.
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "apple-notarization=enabled"
          elif [ -n "${APPLE_ID:-}" ] || [ -n "${APPLE_PASSWORD:-}" ] || [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::Incomplete notarization credentials: APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID must all be set, or all three must be absent."
            exit 1
          else
            echo "apple-notarization=disabled"
          fi

      - name: Import Apple Developer certificate into a CI keychain
        # Reached only when the step above exported APPLE_CERTIFICATE. The
        # keychain password is generated per run rather than stored, so it can
        # neither leak nor need rotating.
        if: env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -n1 | awk -F'"' '{print $2}')"
          if [ -z "$CERT_ID" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "certificate imported"

      - name: Build Tauri app (macOS, universal)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SAME updater signing key as Windows: one trust anchor for the
          # whole product, and its public half is already compiled into every
          # build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # `app` is the bundle the macOS updater actually installs, and
          # `createUpdaterArtifacts` turns it into the signed
          # `<Product>.app.tar.gz` + `.sig` pair `latest.json` points at.
          # `dmg` is the manual-install path for a machine that has never run
          # Station before; an existing install never needs it.
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: v__VERSION__
          releaseName: 'Station Cafe v__VERSION__'
          releaseBody: 'انظر التغييرات في المرفقات / See the assets below.'
          # Identical policy to the Windows job: a real release only for a tag.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}

  # ---------------------------------------------------------------------------
  # The gate that makes "both platforms are updatable" a fact, not a hope.
  # ---------------------------------------------------------------------------
  verify-release:
    needs: [build-windows, build-macos]
    # Read-only: this job only downloads `latest.json` from the published
    # release and audits it. It never creates or uploads anything.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify the published release can update every supported platform
        # Reads the manifest ACTUALLY attached to the release — the same bytes a
        # client downloads from the endpoint — and applies the plugin's own
        # lookup order (`{os}-{arch}-{installer}` then `{os}-{arch}`) for every
        # platform Station ships. A release missing any of them fails the run
        # here, instead of shipping a "successful" release that silently
        # strands half the installed base.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Draft releases (a push to main) are unreachable by tag and serve no
          # client, so the manifest check applies to real releases only.
          PUBLISHED: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ "$PUBLISHED" != "true" ]; then
            echo "not a tag push: the release is a draft and serves no client. Skipping the manifest check."
            exit 0
          fi
          TAG="v$(node -p "require('./package.json').version")"
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/manifest"
          node scripts/verify-release-manifest.mjs "$RUNNER_TEMP/manifest/latest.json"
          tagName: v__VERSION__
          releaseName: 'Station Cafe v__VERSION__'
          releaseBody: 'انظر التغييرات في المرفقات / See the assets below.'
          # Identical policy to the Windows job: a real release only for a tag.
          releaseDraft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
