<!doctype html>
<!--
  Station Cafe — LOCAL WEB (the phone surface).

  This is what a phone browser opens after scanning the QR in Dev Settings. It
  is deliberately NOT the Tauri desktop application: the desktop shell is not
  available in a normal browser, so this is a small standalone app that talks
  to the same Rust HTTP API with `fetch`.

  Hard rules this file obeys, because the cafe's phone may have no internet:

    - No https:// reference, no CDN, no web font, no external script or style.
      Every byte is served by Station itself, from /assets/*.
    - No inline <script> and no inline style, so the page behaves identically
      under the strict Content-Security-Policy the Rust server sends
      (`script-src 'self'; style-src 'self'`).
    - No token, no username and no other credential is embedded here. The
      session is established in the browser through POST /api/v1/auth/login,
      which is the same Rust authentication the desktop application uses.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` lets the safe-area padding in app.css keep content
         clear of the iPhone notch and the Android gesture bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Nothing on this origin should ever leak a path to anywhere else. -->
    <meta name="referrer" content="no-referrer" />
    <title>Station Cafe</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <!-- First paint, before the module script runs and replaces this. A phone
           on a slow café Wi-Fi should never show a blank white screen. -->
      <p class="loading" role="status">جارٍ التحميل…</p>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
